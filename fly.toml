# Fly.io deployment: one machine, one volume. The app keeps everything in files and a small
# SQLite database, so it must not scale past a single machine.
app = "taxonomy"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly's edge sets Fly-Client-IP; believe it for the sign-in and sign-up throttles.
  TAXONOMY_TRUST_PROXY = "fly"
  # The public host claude.ai connectors are told to use: https://<this>/<secret>/mcp
  TAXONOMY_PUBLIC_HOST = "taxonomy.fly.dev"
  # Anyone with the address can make an account, up to this many; after that sign-up says the server is full.
  TAXONOMY_MAX_USERS = "1000"
  # Set to "closed" to stop sign-up after the first account.
  # TAXONOMY_SIGNUP = "closed"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/auth/me"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
