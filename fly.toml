# Fly.io deployment: one machine, one volume. The app keeps everything in files and a small
# SQLite database, so it must not scale past a single machine.
app = "taxonomy"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  # The public host claude.ai connectors are told to use: https://<this>/<secret>/mcp
  TAXONOMY_PUBLIC_HOST = "taxonomy.fly.dev"
  # Sign-up closes after the first account; set to "open" to let more people join.
  # TAXONOMY_SIGNUP = "open"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/auth/me"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
