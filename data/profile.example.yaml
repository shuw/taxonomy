# Taxonomy profile. Amounts are annual dollars for plan.startYear unless noted.
# Real profiles live in data/profiles/<id>.yaml (gitignored); the app creates them.
version: 3
name: Example

# single | mfj | mfs | hoh; state is a two-letter code (only WA is modeled so far); dependents by birth year
filer:
  filingStatus: single
  state: WA
  dependents: []

# the years on screen
plan:
  startYear: 2026
  years: 5

# inflation indexes brackets after 2026; wageGrowth applies to salaries; fmvGrowth to share values; bracketRateDelta shifts every bracket rate
assumptions:
  inflation: 0.025
  wageGrowth: 0.03
  fmvGrowth: 0.15

# base salary and bonus per earner; RSU vests and option exercises are added by the engine
people:
  self:
    name: Me
    salary: 320000
    bonus: 0
    pretaxContributions: 23500
  # spouse:
  #   salary: 150000

# household investment and other income for the start year
income:
  otherOrdinary: 0
  interest: 6000
  ordinaryDividends: 4500
  qualifiedDividends: 4000
  shortTermGains: 0
  longTermGains: 0

# balances entering the first plan year: Form 8801 credit, Schedule D losses, unused charitable gifts
carryforwards:
  amtCredit: 0
  capitalLoss: { shortTerm: 0, longTerm: 0 }
  charitable: 0

# companies with a share price; grants by the portal's three counts (granted, vestedToDate, exercisedToDate); holdings are lots you own
equity:
  companies:
    - id: c1
      name: Example Inc.
      sharePrice: 18.00          # per share at plan.startYear (409A for private companies)
      # pricePath: { 2027: 40 }  # a known or assumed price in a later year (an IPO); growth resumes from there
  grants:
    - id: g1
      name: "2023 ISO grant"
      type: iso
      company: c1
      granted: 40000
      vestedToDate: 40000        # vested by the start of the plan
      exercisedToDate: 0         # already exercised (those shares live in holdings)
      strike: 2.00
    - id: g2
      name: "2025 RSU refresh"
      type: rsu
      company: c1
      granted: 8000
      schedule:
        start: 2025-03-15
        years: 4
        cliffMonths: 12
        cadence: quarterly
  holdings: []

# the mortgage as a loan; interest and the $750k cap are computed
home:
  propertyTax: 0
  # mortgage: { balance: 800000, rate: 0.06, originated: 2022-08-01, originalAmount: 900000 }

# charitable by kind; stateIncomeTax; medical
deductions:
  stateIncomeTax: 0
  charitable: { cash: 0, appreciatedStock: 0, daf: 0 }

# dated changes to any value above, in force from that year on: { year, path, value }
timeline: []
  # - { year: 2028, path: people.self.salary, value: 400000, note: "promotion" }
  # - { year: 2027, path: filer.filingStatus, value: mfj }

# named lever settings; activeScenario picks one
scenarios:
  default:
    events:
      - { id: e1, kind: exercise, type: iso, year: 2026, shares: 4000 }
activeScenario: default
