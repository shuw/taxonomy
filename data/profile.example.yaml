# Taxonomy profile. Amounts are annual dollars for plan.startYear unless noted.
# Real profiles live in data/profiles/<id>.yaml (gitignored); the app creates them.
version: 2
name: Example

# single | mfj | mfs | hoh; state is a two-letter code (only WA is modeled so far)
filer:
  filingStatus: single
  state: WA
  dependents: 0

# the years on screen
plan:
  startYear: 2026
  years: 6

# inflation indexes brackets after 2026; wageGrowth applies to salaries; fmvGrowth to the share value
assumptions:
  inflation: 0.025
  wageGrowth: 0.03
  fmvGrowth: 0.15

# base salary and bonus per earner; RSU vests and option exercises are added by the engine
people:
  self:
    name: Me
    salary: 320000
    bonus: 0
    pretaxContributions: 23500
  # spouse:
  #   salary: 150000

# household investment and other income for the start year
income:
  otherOrdinary: 0
  interest: 6000
  ordinaryDividends: 4500
  qualifiedDividends: 4000
  shortTermGains: 0
  longTermGains: 0

# balances entering the first plan year: Form 8801 credit, Schedule D losses, unused charitable gifts
carryforwards:
  amtCredit: 0
  capitalLoss: { shortTerm: 0, longTerm: 0 }
  charitable: 0

# sharePrice is per share at the start year; grants are iso | nso | rsu with a vesting schedule or per-year counts
equity:
  company: Example Inc.
  sharePrice: 18.00
  grants:
    - name: "2023 ISO grant"
      type: iso
      shares: 40000          # unexercised
      strike: 2.00
      vested: 40000          # vested and unexercised at the start of the plan
    - name: "2025 RSU refresh"
      type: rsu
      shares: 8000
      schedule:
        start: 2025-03-15
        years: 4
        cliffMonths: 12
        cadence: quarterly
  holdings: []

# the mortgage as a loan; interest and the $750k cap are computed
home:
  propertyTax: 0
  # mortgage: { balance: 800000, rate: 0.06, originated: 2022-08-01, originalAmount: 900000 }

# charitable by kind; stateIncomeTax; medical
deductions:
  stateIncomeTax: 0
  charitable: { cash: 0, appreciatedStock: 0, daf: 0 }

# where the sliders start
levers:
  exercises:
    iso:
      2026: 4000
    nso: {}
